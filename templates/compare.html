{% extends "base.html" %}{% block title %}Compare · LexiBrief{% endblock %}{% block content %}<h1>Compare documents</h1><p class="muted">Choose two uploaded files to compare.</p><div class="panel"><form method="post"><label>Document A</label><select class="form-select" name="a" required>{% for d in documents %}<option value="{{d.id}}">{{d.original_name}}</option>{% endfor %}</select><label class="mt-3">Document B</label><select class="form-select" name="b" required>{% for d in documents %}<option value="{{d.id}}">{{d.original_name}}</option>{% endfor %}</select><button class="btn btn-primary mt-3" {% if documents|length<2 %}disabled{% endif %}>Compare</button></form></div>{% if result %}<h3 class="mt-4">Comparison</h3><div class="ai-result">{{result}}</div>{% endif %}{% endblock %}
